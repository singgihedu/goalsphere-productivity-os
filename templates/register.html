<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - GoalSphere</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body class="auth-body">

<div class="auth-wrapper">

    <!-- LEFT SIDE -->
    <div class="auth-left">

        <h1>GoalSphere</h1>

        <p>
            Build habits • Achieve goals
        </p>

        <span>
            Start your productivity system
        </span>

    </div>

    <!-- RIGHT SIDE -->
    <div class="auth-right">

        <div class="auth-card">

            <h2>Create Account</h2>
            <p>Start your productivity journey</p>

            <form method="POST">

                <input type="text"
                name="username"
                placeholder="Username"
                required>

                <input type="email"
                name="email"
                placeholder="Email"
                required>

                <input type="password"
                name="password"
                placeholder="Password"
                required>

                <button type="submit">
                    Register
                </button>

            </form>

            <p class="switch">
                Already have account?
                <a href="/login">Login</a>
            </p>

        </div>

    </div>

</div>

</body>
</html>
